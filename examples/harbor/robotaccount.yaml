apiVersion: harbor.crossplane.io/v1alpha1
kind: RobotAccount
metadata:
  name: my-robot
  namespace: crossplane-system
  annotations:
    # crossplane.io/external-name is the plain robot name (without the "robot$" prefix).
    # Harbor stores it as "robot$my-robot". Defaults to the CR name if not set.
    crossplane.io/external-name: my-robot
spec:
  providerConfigRef:
    kind: ProviderConfig
    name: default
  # The generated secret is written to this connection secret.
  writeConnectionSecretToRef:
    name: robot-account-secret
  forProvider:
    level: system
    description: "CI/CD robot for image push"
    duration: 365   # days; -1 = never expires
    permissions:
      - kind: project
        # Option 1: reference a Project CR (external name is used as namespace)
        namespaceRef:
          name: my-project   # name of the Project CR in the same namespace
        access:
          - resource: repository
            action: push
          - resource: repository
            action: pull
          - resource: artifact
            action: delete
      # Option 2: use a plain project name string directly
      # - kind: project
      #   namespace: another-project
      #   access:
      #     - resource: repository
      #       action: pull
---
apiVersion: harbor.crossplane.io/v1alpha1
kind: RobotAccount
metadata:
  name: my-robot-project-scoped
