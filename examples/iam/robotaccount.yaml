---
# System-level robot account with push/pull access to a specific project.
apiVersion: iam.harbor.crossplane.io/v1alpha1
kind: RobotAccount
metadata:
  name: my-ci-robot
  namespace: default
  annotations:
    # crossplane.io/external-name is the short robot name (without "robot$").
    # Harbor stores it as "robot$my-ci-robot". Defaults to the CR name.
    crossplane.io/external-name: my-ci-robot
spec:
  providerConfigRef:
    name: default
  # The generated token is written to this connection secret.
  writeConnectionSecretToRef:
    name: my-ci-robot-secret
  forProvider:
    level: system
    description: "CI/CD robot for image push"
    duration: 365 # days; -1 = never expires
    disable: false
    permissions:
      - kind: project
        # Option 1: reference a Project CR — external name is used as namespace.
        namespaceRef:
          name: my-project # name of the Project CR in the same namespace
        access:
          - resource: repository
            action: push
          - resource: repository
            action: pull
          - resource: artifact
            action: delete
      # Option 2: use a plain project name directly.
      # - kind: project
      #   namespace: another-project
      #   access:
      #     - resource: repository
      #       action: pull
---
# Project-scoped robot account — scope is limited to a single project.
apiVersion: iam.harbor.crossplane.io/v1alpha1
kind: RobotAccount
metadata:
  name: my-project-robot
  namespace: default
  annotations:
    crossplane.io/external-name: my-project-robot
spec:
  providerConfigRef:
    name: default
  writeConnectionSecretToRef:
    name: my-project-robot-secret
  forProvider:
    level: project
    description: "Project-scoped robot for image push"
    duration: -1 # never expires
    permissions:
      - kind: project
        namespaceRef:
          name: my-project
        access:
          - resource: repository
            action: push
          - resource: repository
            action: pull
